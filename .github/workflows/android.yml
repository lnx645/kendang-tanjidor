name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Android SDK (cmdline-tools 12 — cocok JDK 17)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -o -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          ls "$ANDROID_SDK_ROOT"

      - name: Unduh Godot + template ekspor
        run: |
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/4.3.stable
          curl -sL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d ~/godot-bin
          curl -sL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -o -q /tmp/templates.tpz -d /tmp/tpz
          cp -r /tmp/tpz/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          chmod +x ~/godot-bin/Godot_v4.3-stable_linux.x86_64
          ~/godot-bin/Godot_v4.3-stable_linux.x86_64 --version
          ls ~/.local/share/godot/export_templates/4.3.stable/ | head

      - name: Siapkan keystore debug & pengaturan editor
        run: |
          mkdir -p ~/.android ~/.config/godot build
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" load_steps=2 format=3]

          [resource]
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Ekspor APK Android
        run: |
          # Isi keystore debug ke preset (Godot hanya menandatangani dari preset)
          sed -i "s|^keystore/debug=.*|keystore/debug=\\\"$HOME/.android/debug.keystore\\\"|; s|^keystore/debug_user=.*|keystore/debug_user=\\\"androiddebugkey\\\"|; s|^keystore/debug_password=.*|keystore/debug_password=\\\"android\\\"|; s|^keystore/release=.*|keystore/release=\\\"$HOME/.android/debug.keystore\\\"|; s|^keystore/release_user=.*|keystore/release_user=\\\"androiddebugkey\\\"|; s|^keystore/release_password=.*|keystore/release_password=\\\"android\\\"|" export_presets.cfg
          ~/godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --import || true
          ~/godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --export-release "Android" build/kendang-tanjidor.apk
          ls -la build/

      - name: Pastikan APK tertandatangani
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          if ! "$APKSIGNER" verify build/kendang-tanjidor.apk; then
            echo "APK belum tertandatangani — tandatangani manual"
            "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/kt-signed.apk build/kendang-tanjidor.apk
            mv build/kt-signed.apk build/kendang-tanjidor.apk
            "$APKSIGNER" verify build/kendang-tanjidor.apk
          fi

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: kendang-tanjidor-apk
          path: build/kendang-tanjidor.apk
          if-no-files-found: error
